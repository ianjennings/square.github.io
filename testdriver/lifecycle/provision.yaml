version: 6.0.0
steps:
  - prompt: launch chrome to square open source portal
    commands:
      - command: exec
        lang: pwsh
        code: |
          Start-Process "C:/Program Files/Google/Chrome/Application/chrome.exe" -ArgumentList "--start-maximized", "https://square.github.io"
          exit
      - command: wait-for-text
        text: "Square"
        timeout: 30000