version: 6.0.0
steps:
  - prompt: Launch Chrome browser and navigate to the Jekyll static site
    commands:
      - command: exec
        lang: pwsh
        code: |
          # Launch Chrome with the pre-built Jekyll site URL
          # The site is already built and served by GitHub Actions
          Start-Process "C:/Program Files/Google/Chrome/Application/chrome.exe" -ArgumentList "--start-maximized", "${TD_WEBSITE}"
          exit
      - command: wait-for-text
        text: "Square"
        timeout: 30000
  - prompt: Verify the page has loaded with repository content
    commands:
      - command: wait-for-text
        text: "Open Source"
        timeout: 10000