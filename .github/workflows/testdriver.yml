name: TestDriver Tests

on:
  workflow_run:
    workflows: ["Build and Deploy"]
    types:
      - completed
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # Only run if the build workflow succeeded or if manually triggered
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Get deployment URL
        id: get-url
        run: |
          # Set the GitHub Pages URL for the Square Open Source Portal
          REPO_NAME=$(echo ${{ github.repository }} | cut -d'/' -f2)
          echo "deployment_url=https://${{ github.repository_owner }}.github.io/${REPO_NAME}" >> $GITHUB_OUTPUT
      
      - name: Output deployment URL
        run: |
          echo "Testing site at: ${{ steps.get-url.outputs.deployment_url }}"

      - name: Run TestDriver Tests
        env:
          TD_API_KEY: ${{ secrets.TD_API_KEY }}
          TD_WEBSITE: ${{ steps.get-url.outputs.deployment_url }}
        run: |
          # Run all generated tests
          npx testdriverai@latest run testdriver/generate/*.yaml || true

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testdriver-results-${{ github.run_number }}
          path: testdriver/results/
          if-no-files-found: ignore
          retention-days: 30